name: Scheduled dependency security audit

on:
  schedule:
    - cron: "43 5 * * 1" # weekly, Monday 05:43 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-advisories:
    name: Python advisory audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.15"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: emsign-fixed

      - name: Set up Python 3.15.2
        shell: bash
        run: |
          uv python install 3.15.2 \
            --python-downloads-json-url "${GITHUB_WORKSPACE}/.github/python/cpython-3.15.2-downloads.json"
          echo "UV_PYTHON=3.15.2" >> "$GITHUB_ENV"

      - name: Install locked audit environment
        run: uv sync --locked --all-extras

      - name: Audit installed dependencies
        run: uv run --no-sync pip-audit

  repository-supply-chain:
    name: Repository supply-chain audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
